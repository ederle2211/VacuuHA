<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">VacuuHA vacuum robot</title>
  <desc id="desc">A playful, upside-down Neato-inspired robot vacuum with wobbly eyes and a bulbous lidar nose.</desc>
  <defs>
